<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Atmosphere & Sky Gradient -->
    <linearGradient id="skySunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#3b0764" />
      <stop offset="65%" stop-color="#b91c1c" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="rgba(249, 115, 22, 0.4)" />
      <stop offset="100%" stop-color="rgba(249, 115, 22, 0)" />
    </radialGradient>

    <!-- Deep Ocean Waves Gradients -->
    <linearGradient id="oceanDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="25%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="oceanMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="oceanFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Shark Counter-Shading Gradients -->
    <linearGradient id="sharkDorsal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="sharkBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="textNeonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* CSS Keyframe Animations for GitHub Native SVG */
      @keyframes sharkBreachTrajectory {
        0%, 15% {
          transform: translate(180px, 400px) rotate(-45deg) scale(0.6);
          opacity: 0;
        }
        20% {
          opacity: 1;
          transform: translate(280px, 310px) rotate(-35deg) scale(0.9);
        }
        42% {
          /* Apex of the leap */
          transform: translate(580px, 90px) rotate(5deg) scale(1.15);
          opacity: 1;
        }
        65% {
          /* Dive down into ocean */
          transform: translate(900px, 330px) rotate(48deg) scale(1);
          opacity: 1;
        }
        72%, 100% {
          transform: translate(1020px, 460px) rotate(58deg) scale(0.8);
          opacity: 0;
        }
      }

      @keyframes splashEruptStart {
        0%, 16% { transform: scale(0); opacity: 0; }
        19% { transform: scale(0.5); opacity: 1; }
        26% { transform: scale(1.8); opacity: 0; }
        100% { transform: scale(0); opacity: 0; }
      }

      @keyframes splashEruptEnd {
        0%, 62% { transform: scale(0); opacity: 0; }
        66% { transform: scale(0.6); opacity: 1; }
        74% { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(0); opacity: 0; }
      }

      @keyframes waveScroll1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-60px); }
        100% { transform: translateX(0); }
      }

      @keyframes waveScroll2 {
        0% { transform: translateX(-40px); }
        50% { transform: translateX(40px); }
        100% { transform: translateX(-40px); }
      }

      @keyframes pulseAura {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }

      @keyframes titleFlicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.88; }
      }

      .animated-shark-group {
        animation: sharkBreachTrajectory 5.5s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
        transform-origin: center center;
      }

      .splash-start-ring {
        animation: splashEruptStart 5.5s ease-out infinite;
        transform-origin: 280px 330px;
      }

      .splash-end-ring {
        animation: splashEruptEnd 5.5s ease-out infinite;
        transform-origin: 900px 330px;
      }

      .wave-layer-1 {
        animation: waveScroll1 4s ease-in-out infinite;
      }

      .wave-layer-2 {
        animation: waveScroll2 3s ease-in-out infinite;
      }

      .sun-pulse {
        animation: pulseAura 4s ease-in-out infinite;
      }

      .neon-title {
        animation: titleFlicker 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Sky -->
  <rect width="1200" height="480" fill="url(#skySunset)" />

  <!-- 2. Sun & Glow Aura -->
  <circle cx="920" cy="110" r="140" fill="url(#sunGlow)" class="sun-pulse" />
  <circle cx="920" cy="110" r="45" fill="#fffbeb" opacity="0.9" filter="url(#glow)" />

  <!-- 3. Ambient Clouds / Horizon Haze -->
  <g opacity="0.25">
    <ellipse cx="250" cy="90" rx="140" ry="24" fill="#ffffff" />
    <ellipse cx="650" cy="130" rx="190" ry="28" fill="#fdba74" />
    <ellipse cx="1080" cy="80" rx="110" ry="20" fill="#ffffff" />
  </g>

  <!-- 4. Background Ocean Wave (Deep) -->
  <path class="wave-layer-1" d="M 0 310 Q 150 285, 300 310 T 600 310 T 900 310 T 1200 310 L 1200 480 L 0 480 Z" fill="url(#oceanDeep)" opacity="0.95" />

  <!-- 5. Splash Ring at Entry Point (Left) -->
  <g class="splash-start-ring">
    <ellipse cx="280" cy="330" rx="60" ry="16" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
    <ellipse cx="280" cy="330" rx="35" ry="10" fill="none" stroke="#67e8f9" stroke-width="2.5" />
    <!-- Water spray droplets -->
    <circle cx="260" cy="300" r="4" fill="#ffffff" />
    <circle cx="295" cy="290" r="5" fill="#ffffff" />
    <circle cx="315" cy="310" r="3.5" fill="#67e8f9" />
  </g>

  <!-- 6. THE BREACHING SHARK (Animated trajectory) -->
  <g class="animated-shark-group">
    <!-- Shark Shadow & Water Gleam -->
    <g filter="url(#glow)">
      <!-- Main Hydrodynamic Dorsal Body -->
      <path d="M 95 0 C 70 -26, 15 -34, -40 -20 C -70 -12, -90 -6, -115 -2 L -150 -45 C -138 -18, -125 0, -134 6 L -154 38 C -130 14, -100 8, -90 5 C -55 22, 10 30, 65 18 C 84 10, 92 5, 95 0 Z" fill="url(#sharkDorsal)" stroke="#38bdf8" stroke-width="1.5" />

      <!-- White Counter-Shaded Underbelly -->
      <path d="M 95 0 C 82 8, 65 18, 10 30 C -55 22, -90 5, -115 -2 C -85 5, -48 7, 0 4 C 48 -1, 80 -2, 95 0 Z" fill="url(#sharkBelly)" />

      <!-- Iconic Dorsal Fin -->
      <path d="M 12 -28 C 6 -65, -9 -74, -22 -78 C -16 -54, -12 -38, -26 -22 Z" fill="url(#sharkDorsal)" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Pectoral Fin -->
      <path d="M 38 12 C 18 45, -6 70, -30 74 C -22 54, -10 34, 6 18 Z" fill="url(#sharkDorsal)" stroke="#38bdf8" stroke-width="1.2" />

      <!-- 5 Gill Slits -->
      <path d="M 30 -5 Q 28 4, 30 12" stroke="#0f172a" stroke-width="2" fill="none" />
      <path d="M 24 -5 Q 22 4, 24 12" stroke="#0f172a" stroke-width="2" fill="none" />
      <path d="M 18 -5 Q 16 4, 18 12" stroke="#0f172a" stroke-width="2" fill="none" />
      <path d="M 12 -5 Q 10 4, 12 12" stroke="#0f172a" stroke-width="2" fill="none" />
      <path d="M 6 -5 Q 4 4, 6 12" stroke="#0f172a" stroke-width="2" fill="none" />

      <!-- Predatory Eye -->
      <circle cx="76" cy="-4" r="3.5" fill="#020617" />
      <circle cx="77" cy="-5" r="1.2" fill="#ffffff" />

      <!-- Wet Skin Sheen Reflection -->
      <path d="M 85 -2 C 52 -22, 2 -24, -48 -14" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" />
    </g>
  </g>

  <!-- 7. Splash Ring at Landing Point (Right) -->
  <g class="splash-end-ring">
    <ellipse cx="900" cy="330" rx="75" ry="20" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#glow)" />
    <ellipse cx="900" cy="330" rx="45" ry="12" fill="none" stroke="#38bdf8" stroke-width="3" />
    <!-- Water spray droplets -->
    <circle cx="870" cy="285" r="5" fill="#ffffff" />
    <circle cx="915" cy="275" r="6" fill="#ffffff" />
    <circle cx="945" cy="295" r="4.5" fill="#67e8f9" />
  </g>

  <!-- 8. Mid-Ground Ocean Wave -->
  <path class="wave-layer-2" d="M -50 325 Q 120 295, 320 325 T 720 325 T 1120 325 T 1300 325 L 1300 480 L -50 480 Z" fill="url(#oceanMid)" opacity="0.9" />

  <!-- 9. Foreground Crest Wave with Surf Foam -->
  <path d="M 0 340 Q 180 320, 360 340 T 720 340 T 1080 340 T 1200 340 L 1200 480 L 0 480 Z" fill="url(#oceanFront)" />
  <path d="M 0 340 Q 180 320, 360 340 T 720 340 T 1080 340 T 1200 340" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8" />

  <!-- 10. Center Banner Typography -->
  <g text-anchor="middle">
    <!-- Subtitle Pill -->
    <rect x="430" y="32" width="340" height="28" rx="14" fill="#020617" fill-opacity="0.85" stroke="#00f2fe" stroke-width="1.5" />
    <text x="600" y="51" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">
      ✦ OFFICIAL GITHUB PROFILE ✦
    </text>

    <!-- Main Name Heading -->
    <text x="600" y="112" fill="url(#textNeonGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="3" class="neon-title" filter="url(#strongGlow)">
      NGUYEN NGO THINH
    </text>

    <!-- Roles & Specialization -->
    <text x="600" y="148" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">
      Backend Developer • AI Explorer • Shark Spirit
    </text>

    <!-- Tech Badges Line -->
    <text x="600" y="180" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">
      [ Python • C/C++ • MySQL • AI LLMs • N5 Japanese ]
    </text>
  </g>

  <!-- 11. Subtle Tribal Shark Corner Crest -->
  <g transform="translate(45, 45) scale(0.24)" opacity="0.75" filter="url(#glow)">
    <path d="M 280 90 C 330 95, 380 105, 430 135 C 410 145, 380 155, 350 160 C 380 170, 420 185, 450 190 C 410 205, 360 215, 300 205 C 330 220, 360 235, 370 250 C 330 245, 290 230, 260 210 C 230 220, 200 235, 170 260 C 185 240, 205 225, 230 215 C 200 210, 160 200, 130 180 C 160 175, 190 175, 220 180 C 245 160, 280 140, 320 130 C 290 120, 250 115, 210 120 C 240 100, 260 92, 280 90 Z" fill="#00f2fe" />
    <path d="M 220 40 C 240 70, 265 100, 300 115 C 270 118, 240 115, 215 105 C 195 90, 180 70, 170 50 C 185 45, 205 40, 220 40 Z" fill="#00f2fe" />
  </g>
</svg>
